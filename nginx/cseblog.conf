server {
    listen 80;
    server_name cseblog.valliammai.ac.in;
    client_max_body_size 5m;
    location /static/ { alias /var/www/cseblog/static/; }
    location /media/ { alias /var/www/cseblog/media/; }
    location /api/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
