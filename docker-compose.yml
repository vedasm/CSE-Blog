services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
  django:
    build: {context: ., dockerfile: django_app/Dockerfile}
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app/django_app
    volumes: [.:/app, media_vol:/app/django_app/media]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ['8000:8000']
  fastapi:
    build: {context: ., dockerfile: fastapi_app/Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    working_dir: /app/fastapi_app
    volumes: [.:/app]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    ports: ['8001:8001']
  celery:
    build: {context: ., dockerfile: django_app/Dockerfile}
    command: celery -A config worker -l info
    working_dir: /app/django_app
    volumes: [.:/app, media_vol:/app/django_app/media]
    env_file: .env
    depends_on: [postgres, redis]
volumes: {pgdata: {}, media_vol: {}}
