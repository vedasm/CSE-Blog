services:
  redis:
    image: redis:7-alpine
  django:
    build: {context: ., dockerfile: django_app/Dockerfile}
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    working_dir: /app/django_app
    volumes: [.:/app, media_vol:/app/django_app/media]
    env_file: .env
    depends_on: [redis]
    ports: ['8000:8000']
  fastapi:
    build: {context: ., dockerfile: fastapi_app/Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    working_dir: /app/fastapi_app
    volumes: [.:/app]
    env_file: .env
    ports: ['8001:8001']
  celery:
    build: {context: ., dockerfile: django_app/Dockerfile}
    command: celery -A config worker -l info
    working_dir: /app/django_app
    volumes: [.:/app, media_vol:/app/django_app/media]
    env_file: .env
    depends_on: [redis]
volumes: {media_vol: {}}
