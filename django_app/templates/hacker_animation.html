<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Blog | System Override</title>
    <style>
        :root {
            --brand-blue: #365ACA;
            --bg-black: #0a0a0c;
            --text-glow: #4a7be8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            background-image: linear-gradient(rgba(10, 10, 12, 0.8), rgba(10, 10, 12, 0.8)),
                              url('https://www.pixelstalk.net/wp-content/uploads/images6/Coding-HD-Wallpaper-Free-download.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.6; /* Slightly lowered opacity to let the background show through */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            background: radial-gradient(circle, transparent 20%, rgba(10, 10, 12, 0.8) 100%);
            pointer-events: none;
        }

        .terminal-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--brand-blue);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(54, 90, 202, 0.3);
            max-width: 600px;
            width: 90%;
        }

        .terminal-header {
            display: flex;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .typing-text {
            color: var(--brand-blue);
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 100px;
            text-shadow: 0 0 8px var(--text-glow);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--brand-blue);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .system-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--brand-blue);
            font-size: 0.8rem;
            text-align: right;
            opacity: 0.6;
            z-index: 3;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="overlay">
        <div class="terminal-box">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="typing-text" id="typewriter"></div>
            <span class="cursor"></span>
        </div>
    </div>

    <div class="system-status">
        STATUS: SYSTEM_OVERRIDE_ACTIVE<br>
        ENCRYPTION: AES-256-GCM<br>
        LOCATION: SRM_VALLIAMMAI_CSE_NODE
    </div>

    <script>
        // --- Matrix Rain Animation ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>[]{}();:,.!#$%-+*=/'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            // Faded black background to create trails
            ctx.fillStyle = 'rgba(10, 10, 12, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#365ACA'; // Brand Blue
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- Typewriter Animation ---
        const textElement = document.getElementById('typewriter');
        const messages = [
            "> Initializing system boot...",
            "> Connecting to SRM Valliammai CSE Node...",
            "> Accessing encrypted blog archives...",
            "> Bypassing firewall...",
            "> Welcome, Administrator.",
            "> Loading technical articles... [OK]",
            "> System Ready."
        ];

        let messageIndex = 0;
        let charIndex = 0;

        function type() {
            if (messageIndex < messages.length) {
                const currentMessage = messages[messageIndex];
                if (charIndex < currentMessage.length) {
                    textElement.innerHTML += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, Math.random() * 50 + 30);
                } else {
                    setTimeout(() => {
                        textElement.innerHTML += "<br>";
                        messageIndex++;
                        charIndex = 0;
                        type();
                    }, 800);
                }
            } else {
                // Reset loop after some time
                setTimeout(() => {
                    textElement.innerHTML = "";
                    messageIndex = 0;
                    charIndex = 0;
                    type();
                }, 5000);
            }
        }

        window.addEventListener('DOMContentLoaded', type);
    </script>
</body>
</html>
