<div class="admin-topbar">
    <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-outline-primary d-lg-none" id="adminMenuToggle" aria-controls="adminSidebar" aria-expanded="false" aria-label="Toggle admin navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="mb-0" style="font-size: 1.5rem;">{% block page_title %}Admin Panel{% endblock %}</h2>
    </div>
    <div class="d-flex align-items-center gap-3">
        <div class="text-end d-none d-sm-block">
            <div class="fw-bold" style="font-size: 0.9rem;">{{ request.user.get_full_name|default:request.user.email }}</div>
            <div class="text-muted" style="font-size: 0.8rem;">{{ request.user.get_role_display }}</div>
        </div>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none text-dark" data-bs-toggle="dropdown">
                <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=random" class="rounded-circle" width="35" height="35" alt="User Avatar">
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                <li><a class="dropdown-item" href="#"><i class="fa-solid fa-user me-2"></i> Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
