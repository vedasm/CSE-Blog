{% if page_obj.paginator.num_pages > 1 %}<nav class="mt-4"><ul class="pagination justify-content-center">{% for page in page_obj.paginator.page_range %}<li class="page-item {% if page == page_obj.number %}active{% endif %}"><a class="page-link" href="?page={{ page }}&search={{ request.GET.search }}">{{ page }}</a></li>{% endfor %}</ul></nav>{% endif %}
